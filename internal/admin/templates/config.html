{{define "content"}}
<div class="pagehead"><h1>配置</h1>{{template "restartbtn" .}}</div>
<div class="sub">保存前将校验配置，校验未通过时不会写入。请勿在此填写密码或密钥，应保存至环境变量并以 vault://名称 引用。模型相关配置可在「模型」页填写。</div>

<div class="cols one">
<div>
<form method="post" action="/config" class="card" style="overflow:hidden">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <div class="band"><span class="mono" style="color:var(--text-2)">{{index .Data "Path"}}</span><span class="pill plain">YAML</span></div>
  <textarea class="code" name="text" spellcheck="false" wrap="off">{{index .Data "Text"}}</textarea>
  <div class="band foot"><span class="note muted">原配置将备份为 .bak 文件。保存后需重启服务方可生效。</span><button class="btn">校验并保存</button></div>
</form>

</div>
</div>
{{end}}
