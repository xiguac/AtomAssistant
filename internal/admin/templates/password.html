{{define "content"}}
<h1>修改登录密码</h1>
<div class="sub">修改管理后台的登录密码。新密码立即生效，无需重启服务；其他已登录的会话将全部退出。</div>

<form method="post" action="/password" autocomplete="off" class="card" style="max-width:520px">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <div class="pad" style="display:grid;gap:16px">
    <div><label for="pw-current">当前密码</label><input id="pw-current" type="password" name="current" autocomplete="current-password"></div>
    <div><label for="pw-new">新密码</label><input id="pw-new" type="password" name="new" autocomplete="new-password">
      <div class="help">至少 10 个字符</div></div>
    <div><label for="pw-confirm">确认新密码</label><input id="pw-confirm" type="password" name="confirm" autocomplete="new-password"></div>
  </div>
  <div class="band foot"><span class="note muted">密码仅以不可逆的摘要形式保存。</span><button class="btn">修改密码</button></div>
</form>

<div class="card" style="max-width:520px">
  <div class="band"><b>忘记密码</b></div>
  <div class="pad note">忘记密码时无法在此页面找回。请在部署所用的电脑上运行 <span class="mono">deploy/deploy.sh passwd</span> 重新设置。</div>
</div>
{{end}}
