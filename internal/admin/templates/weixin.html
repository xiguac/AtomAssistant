{{define "content"}}
<div class="crumb"><a href="/channels">渠道</a> / 微信扫码连接</div>
<h1>微信扫码连接</h1>
<div class="sub">使用手机微信扫描下方二维码并确认授权。连接成功后，凭证保存至保险库，扫码的微信号将设为渠道「{{.Data.Name}}」的主人。二维码数分钟内有效。</div>

<div class="cols even">
<div class="card">
  <div class="band"><b>登录二维码</b></div>
  <div class="pad" style="display:flex;justify-content:center">
    <div class="totp" style="grid-template-columns:240px"><div class="qr">{{.Data.QR}}</div></div>
  </div>
  <div class="band foot"><span class="note muted" style="word-break:break-all">二维码无法显示时，可在手机微信中打开此链接：{{.Data.Link}}</span></div>
</div>

<form method="post" action="/channels/weixin/poll" class="card" data-poll style="margin-top:0">
  <input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="name" value="{{.Data.Name}}">
  <div class="band"><b>连接状态</b></div>
  <div class="pad">
    <label for="wx-code">验证数字</label>
    <input id="wx-code" class="otp sm" type="text" name="code" inputmode="numeric" autocomplete="off" placeholder="按提示填写">
    <div class="help">仅当状态提示需要输入手机上显示的数字时填写，填写后等待下一次状态检查</div>
  </div>
  <div class="async-result ok">正在检查连接状态…</div>
  <div class="band foot">
    <span class="note muted">页面会自动检查连接状态。脚本不可用时，可点击右侧按钮手动检查。</span>
    <div class="actions"><a class="btn sec" href="/channels">返回渠道页</a><button class="btn sec" data-async>检查状态</button></div>
  </div>
</form>
</div>
{{end}}
