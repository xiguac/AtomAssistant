# 原子助手配置示例
#
# 用法：ATOM_CONFIG=./config.yaml go run ./cmd/atomd
# 不设置 ATOM_CONFIG 时 atomd 跑在 demo 模式，不会产生任何真实副作用。
#
# 校验配置而不启动：go run ./cmd/atomd -check

# ---------------------------------------------------------------
# 模型服务。密钥只能通过环境变量提供，不允许写在这个文件里——
# 配置文件常被复制、备份、贴进聊天窗口求助，密钥不该跟着一起走。
# ---------------------------------------------------------------
#
# protocol 是接口协议，不写按 openai：
#   openai     OpenAI Chat Completions 兼容。base_url 写到 /v1 一级。国内主流服务都支持，建议优先用它：
#              它有"只输出 JSON"的开关，规划结果能稳定解析。
#   anthropic  Anthropic Messages 兼容（Claude，以及提供该格式的其他服务）。base_url 写到 /v1 的上一级。
providers:
  - name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  # - name: claude
  #   base_url: https://api.anthropic.com
  #   protocol: anthropic
  #   api_key: vault://claude

# ---------------------------------------------------------------
# 按用途路由模型。规划用强模型，打标/摘要/抽取用便宜模型——
# 后者的调用量通常是前者的几十倍，这是成本控制里最有效的一招。
#
# purpose 取值: plan / extract / summarize / vision
# ---------------------------------------------------------------
#
# input_yuan_per_mtok / output_yuan_per_mtok 是每百万 token 的单价（元），照服务商的价目表填。
# 不填则这条路由不计费，任务的金额预算对它不起作用（token 预算仍然生效）。
routes:
  - purpose: plan
    provider: deepseek
    model: deepseek-chat
    max_tokens: 4000
    # input_yuan_per_mtok: 2
    # output_yuan_per_mtok: 8
  - purpose: extract
    provider: deepseek
    model: deepseek-chat
    max_tokens: 1000

fallback:
  provider: deepseek
  model: deepseek-chat
  max_tokens: 2000

# ---------------------------------------------------------------
# 协作模型（可选）。配了之后，主 AI 可以把写作、编程、翻译这类成块的活派给它们，几份同时进行。
# 派给谁不由主 AI 决定，由你的评价决定：后台任务页上点「好 / 不行」，或在聊天里回 /赞、/踩。
# 协作模型没有任何工具，只看得到主 AI 交给它的要求和材料。
# 这一节以及上面三节都可以在管理后台的「模型」页里填，不必手写。
#
#   name     自己起的名字，成绩记在它下面
#   good_at  只让它接哪几类：writing / code / analysis / translate / summary / creative / other
#            不写就是什么都接，由成绩说话
#   tier     只让它接哪一档难度：simple / complex；不写就是都接。
#            主 AI 指派时先判断一件事是短程的还是要规划的：短程的由主 AI 自己办，不派给协作模型，
#            所以 tier: simple 的协作模型接不到活；要规划的交给不限难度或 tier: complex 的
# ---------------------------------------------------------------
# agents:
#   - name: 写手
#     provider: moonshot
#     model: moonshot-v1-32k
#     good_at: [writing, translate]
#   - name: 快手
#     provider: deepseek
#     model: deepseek-chat
#   - name: 码农
#     provider: deepseek
#     model: deepseek-reasoner
#     tier: complex

# ---------------------------------------------------------------
# 每个任务的预算上限。任一项用到上限任务就暂停，不会接着花。不写的项用默认值
# （60 万 token、5 元、执行 24 小时）。也可以在管理后台的「模型」页里填。
#   max_tokens     一个任务最多用多少 token（输入加输出）
#   max_cost_yuan  一个任务最多花多少钱（元），按上面路由里填的单价算
#   max_hours      一个任务最多真正执行多少小时，等待的时间不算
# ---------------------------------------------------------------
# budget:
#   max_tokens: 2000000
#   max_cost_yuan: 20

# ---------------------------------------------------------------
# 回复风格。默认简洁——多数时候要的是结论，不是一篇文章。
#   style   concise（简洁）/ balanced（适中）/ detailed（详细）
#   custom  你自己的额外要求，原样交给助手
#   voice   learn（默认）/ off。learn 时助手会从你亲手写的话里学你的说话方式，
#           替你写邮件、对你说话时向它靠拢。学到了什么用 atomctl style show 查看
# ---------------------------------------------------------------
reply:
  style: concise
  # custom: 结论放第一句，不要用表情
  # voice: off

# ---------------------------------------------------------------
# 文件处理：读写 Word、Excel、PowerPoint，读 PDF、CSV 和文本。全部在本机完成。
# 不写这一节，助手没有任何读写文件的工具。
#
#   dir  工作区目录。助手只能读写这个目录里的文件：把要处理的文件放进来
#        （atomctl file add <文件>，或者直接拷进去），它生成的文件也落在这里。
#        覆盖已有文件时旧的那份留底在工作区的 .versions 里。
#   encrypt  设为 true 后，写进工作区的文件落盘即加密，读它、把它发给你的时候再解开。
#            默认不开：文件可能很大，值不值得多做一遍加解密由你决定。
#            可以中途打开或关掉：之前的文件不受影响，照常能读。
#            注意：开了之后工作区里的文件只能经助手和后台取用，直接从磁盘拷走的是密文。
# ---------------------------------------------------------------
# files:
#   dir: ./data/files
#   encrypt: true

# ---------------------------------------------------------------
# 消息渠道：在聊天软件里直接和助手说话。目前支持 QQ 机器人（单聊）。
#
# 这一节只能由你亲手编辑——写在这里的渠道，其主人发来的消息带着你本人的权限。
#   secret  机器人的 AppSecret，只能写保险库句柄：
#             atomctl vault put qqbot "QQ 机器人 AppSecret" channel.qq
#           授权名单里的名字是 channel.<渠道名>
#   owners  主人在这个渠道里的账号标识，只有他们发来的消息会被处理。
#           第一次接入时留空：给机器人发一句话，它会把你的标识回给你，填进来再重启
#   sandbox 机器人还没上线、只在 QQ 的沙箱环境里调试时设为 true
# ---------------------------------------------------------------
# channels:
#   - name: qq
#     type: qq
#     app_id: "102012345"
#     secret: vault://qqbot
#     owners: []
#   # 飞书（type: feishu）与钉钉（type: dingtalk）的写法相同：app_id 是飞书的 App ID / 钉钉的 Client ID，
#   # secret 指向 App Secret / Client Secret。钉钉可另写 robot_code，不写按 app_id。
#   - name: feishu
#     type: feishu
#     app_id: cli_xxxxxxxx
#     secret: vault://channel.feishu
#     owners: []
#   # 微信（type: weixin）不用手写：在管理后台的「渠道」页用微信扫码连接，
#   # 机器人标识、凭证、接口地址和主人都由扫码流程填好。

# ---------------------------------------------------------------
# 语音识别：聊天里发来的语音消息转成文字，和打的字一样交给助手（语音本身不交给模型）。
# 不写这一节，发来语音会被告知收不了。当作文件发来的音频按文件收，不经过它。
#
#   url  识别服务的地址。用 deploy/deploy.sh asr 安装到服务器上，会自动写入这一节。
# ---------------------------------------------------------------
# asr:
#   url: http://127.0.0.1:8765

# ---------------------------------------------------------------
# 连接器：直连开放协议的日历（CalDAV）和邮件（IMAP/SMTP）。不写的那一项就不接入。
#
# password 只能写保险库句柄，不接受明文。先把密码存进去并授权给连接器：
#   atomctl vault put icloud "iCloud App 专用密码" connector.calendar,connector.mail
# iCloud 要用「App 专用密码」（在 account.apple.com 的"登录与安全"里生成），不是 Apple ID 的登录密码。
# 写好之后用 atomctl connector check 试连。
#
# 日历的新建和修改：你亲口交代的直接写；任务读过邮件、网页之后的改动要你确认。
# 删除日程、发信、整理邮件默认每一次都要你确认，可以在下面的 approval.rules 里按工具调整。
# ---------------------------------------------------------------
# connectors:
#   calendar:
#     url: https://caldav.icloud.com
#     username: you@icloud.com
#     password: vault://icloud
#     # default_calendar: 个人          # 新建日程默认写进哪个日历；只有一个日历时不用写
#   mail:
#     imap: imap.mail.me.com:993
#     smtp: smtp.mail.me.com:587        # 不写则助手只能读和整理邮件，不能发信
#     username: you@icloud.com
#     password: vault://icloud
#     # from: you@icloud.com            # 发信地址，不写按 username
#     # name: 张三                      # 发信时显示的名字
#     # imap_security / smtp_security: tls / starttls / none，不写按端口推断；none 只允许本机地址
#   # 节假日与调休安排：一个公开的日历订阅，不需要账号。助手靠它知道哪天放假、哪个周末补班
#   holidays:
#     url: https://calendars.icloud.com/holidays/cn_zh.ics
#   # 天气：和风天气（https://dev.qweather.com/docs/）。接上之后助手多一个 weather.forecast 工具，
#   # 查实时天气、10 天内的逐日预报和正在生效的气象预警。
#   # host 是你自己的 API Host（控制台的「设置」里看），key 是 API KEY，只能写保险库句柄：
#   #   atomctl vault put connector.weather "和风天气 API KEY" connector.weather
#   # 也可以在管理后台的「连接器」页里填。
#   weather:
#     host: abcxyz.qweatherapi.com
#     key: vault://connector.weather

# ---------------------------------------------------------------
# 付款。不写这一节，助手没有任何付款工具。
#
# 需要先安装支付宝官方的 alipay-bot 并开通钱包：
#   npx -y @alipay/agent-payment@latest install
#   atomctl pay wallet open
#
# resource_domains 是允许助手请求的按次收费接口（HTTP 402）的域名，逐个列出，
# 写 example.com 同时允许它的子域名。不写则助手不能主动请求任何网址。
# 每一笔付款都要你确认，并且要你本人在支付宝里授权。
# ---------------------------------------------------------------
# payment:
#   alipay:
#     enabled: true
#     # command: /path/to/alipay-bot     # 不在 PATH 里时指定
#     # resource_domains: [api.example.com]

# ---------------------------------------------------------------
# 已批准的 MCP server。transport 取值: command / http
#
# env 里只列出这个 server 确实需要的变量。主进程的环境不会被继承——
# 否则数据库密码和模型密钥会一并交给第三方工具。
# 例外是 PATH、HOME 这几个找解释器、放缓存用的变量：没有它们 npx、uvx 起不来。
# ---------------------------------------------------------------
mcp_servers: []
# mcp_servers:
#   - name: maps
#     transport: command
#     command: /usr/local/bin/mcp-amap
#   - name: flight
#     transport: http
#     url: https://mcp.example.com/mcp
#   # 高德地图（https://developer.amap.com/api/mcp-server/summary）。在管理后台的「MCP」页
#   # 填一个 Key 就能接入，下面是它写出来的样子。
#   # server 要的密钥只能放在保险库里：secret 写句柄，保险库那一条的授权名单要有 mcp.<server 名>；
#   # secret_name 是把它交给 server 时用的名字——远程 server 是网址里的查询参数名，
#   # 本地 server 是环境变量名。
#   - name: amap
#     transport: http
#     url: https://mcp.amap.com/mcp
#     secret_name: key
#     secret: vault://mcp.amap
#     # 要不止一项密钥的 server，其余的写在 secrets 里，写法相同（后台的「MCP」页可以逐项填写）：
#     # secrets:
#     #   - name: app_secret
#     #     secret: vault://mcp.amap.app_secret
#   # 滴滴出行（https://mcp.didichuxing.com/api）同样是预置的，填一个 MCP Key 即可。
#   # 价格预估、路线规划这些查询按只读登记；创建订单、取消订单按不可撤销登记，每次都要你确认。
#   - name: didi
#     transport: http
#     url: https://mcp.didichuxing.com/mcp-servers
#     secret_name: key
#     secret: vault://mcp.didi
#   # 飞常准（航班数据）也是预置的，填一个 API Key 即可。它的密钥放在请求头里：secret_in 写 header，
#   # secret_name 是请求头的名字，保险库里存的是完整的值（Bearer vf_usr_…）。不写 secret_in 就是放在网址的查询参数里。
#   - name: variflight
#     transport: http
#     url: https://c-gw.variflight.com/chat_message/mcp/api
#     secret_name: Authorization
#     secret_in: header
#     secret: vault://mcp.variflight
#   # 12306（https://github.com/Joooook/12306-mcp）也是预置的：查余票、中转、经停站，不能购票。
#   # 它在本机以子进程运行，机器上要有 Node.js 18 以上。版本是固定的，要升级就改这里的版本号。
#   - name: "12306"
#     transport: command
#     command: npx
#     args: ["-y", "12306-mcp@0.3.10"]

# ---------------------------------------------------------------
# 工具授权边界。对应用户在 App 上批准某个工具时的选择。
# 目录里可见 ≠ 可调用：没有在这里授权的工具，调用会被直接拒绝。
#
#   max_privacy   允许传给它的最高隐私等级: public / normal / sensitive
#                 不接受 secret——绝密数据不能长期授权给任何工具，只能每次由你确认
#   trust         它的输出信任上限: external / tool_output / connector
#                 不接受 user / system——工具输出不能具备指令资格
#   side_effect   none / read_only / reversible / irreversible
#                 不写按 irreversible 处理（最保守）
#   egress_domains  允许的出站域名。不写表示不允许任何网络出站
#   allowed_fields  允许传入的参数字段。不写则不做字段裁剪
# ---------------------------------------------------------------
tools: []
# tools:
#   - name: maps.geocode
#     max_privacy: normal
#     trust: connector
#     side_effect: read_only
#     egress_domains: [restapi.amap.com]
#     allowed_fields: [address, city]
#
#   - name: maps.book_ride
#     max_privacy: sensitive
#     trust: connector
#     side_effect: irreversible
#     egress_domains: [restapi.amap.com]
#     allowed_fields: [origin, destination, car_type, amount_cents]

# ---------------------------------------------------------------
# 审批策略。默认一律手动确认，下面的规则是"放宽"。
#
# 三条不受配置影响的硬规则：
#   1. 参数含绝密数据(L3) → 一律由你确认，确认时会列出是哪几项（字段和类别，不显示值）；
#      任何放行规则和自主模式都不能让它自动执行
#   2. 由截图/邮件/网页等 untrusted 内容驱动的写操作 → 无论金额一律手动。
#      任务是你建的也一样：它中途读过邮件、网页，之后的写操作就按这一条办
#   3. 只读操作 → 始终放行，不消耗配额
# ---------------------------------------------------------------
approval:
  # 审批模式，不写按 auto。
  #   auto     自主模式：取数据和内部的处理不用你确认，长程任务不用人一直盯着——
  #              - 查询、读取：直接执行
  #              - 写进你自己的日历、工作区，整理你自己的邮箱：直接执行；其中修改和删除由主模型把关
  #              - 对外发送（发邮件、付款与付费请求、通过 MCP 工具向外部服务提交信息）：仍然由你确认，
  #                除非你在下面为那个工具写了放行规则
  #            下面这些照旧，没有开关：
  #              - 绝密数据（证件号、银行卡号、健康信息、密钥）要交给任何工具都由你确认
  #              - 不是你发起的任务（外部事件触发的）不能改动任何东西
  #              - 写了 never: true 的工具始终确认；写了条件的按条件
  #              - 涉及金额的操作必须有金额上限罩着（caps 里的单任务或单日金额），没设上限就仍然确认
  #              - 金额无法核实的付款、有外传风险的安装，始终确认
  #   confirm  逐项确认：没有写规则的改动一律先问；任务读过外部内容之后的改动一律先问
  #            （防的是网页、邮件里埋一句话让助手去发信、下单）。
  mode: auto
  rules:
    # 私人出行且金额低于 100 元时自动放行
    - tool: maps.book_ride
      amount_below_yuan: 100
      domain: personal

    # 日历的新建和修改默认直接执行（接入了日历连接器时）。想要每次都确认就写 never：
    # - tool: calendar.create
    #   never: true

    # 归档、移进废纸篓这类整理邮件的操作直接执行，不用确认
    # - tool: mail.move

    # 发消息永远手动确认
    - tool: mail.send
      never: true

  # 累计帽子。只设单次阈值是个洞：100 元以下自动放行可以被拆成 50 次。
  caps:
    daily_auto_amount_yuan: 500
    daily_auto_count: 20
    per_task_amount_yuan: 1000
