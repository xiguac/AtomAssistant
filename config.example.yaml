# 原子助手配置示例
#
# 用法：ATOM_CONFIG=./config.yaml go run ./cmd/atomd
# 不设置 ATOM_CONFIG 时 atomd 跑在 demo 模式，不会产生任何真实副作用。
#
# 校验配置而不启动：go run ./cmd/atomd -check

# ---------------------------------------------------------------
# 模型服务。密钥只能通过环境变量提供，不允许写在这个文件里——
# 配置文件常被复制、备份、贴进聊天窗口求助，密钥不该跟着一起走。
# ---------------------------------------------------------------
providers:
  - name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    timeout: 120s

# ---------------------------------------------------------------
# 按用途路由模型。规划用强模型，打标/摘要/抽取用便宜模型——
# 后者的调用量通常是前者的几十倍，这是成本控制里最有效的一招。
#
# purpose 取值: plan / extract / summarize / vision
# ---------------------------------------------------------------
#
# input_yuan_per_mtok / output_yuan_per_mtok 是每百万 token 的单价（元），照服务商的价目表填。
# 不填则这条路由不计费，任务的金额预算对它不起作用（token 预算仍然生效）。
routes:
  - purpose: plan
    provider: deepseek
    model: deepseek-chat
    max_tokens: 4000
    # input_yuan_per_mtok: 2
    # output_yuan_per_mtok: 8
  - purpose: extract
    provider: deepseek
    model: deepseek-chat
    max_tokens: 1000

fallback:
  provider: deepseek
  model: deepseek-chat
  max_tokens: 2000

# ---------------------------------------------------------------
# 回复风格。默认简洁——多数时候要的是结论，不是一篇文章。
#   style   concise（简洁）/ balanced（适中）/ detailed（详细）
#   custom  你自己的额外要求，原样交给助手
#   voice   learn（默认）/ off。learn 时助手会从你亲手写的话里学你的说话方式，
#           替你写邮件、对你说话时向它靠拢。学到了什么用 atomctl style show 查看
# ---------------------------------------------------------------
reply:
  style: concise
  # custom: 结论放第一句，不要用表情
  # voice: off

# ---------------------------------------------------------------
# 消息渠道：在聊天软件里直接和助手说话。目前支持 QQ 机器人（单聊）。
#
# 这一节只能由你亲手编辑——写在这里的渠道，其主人发来的消息带着你本人的权限。
#   secret  机器人的 AppSecret，只能写保险库句柄：
#             atomctl vault put qqbot "QQ 机器人 AppSecret" channel.qq
#           授权名单里的名字是 channel.<渠道名>
#   owners  主人在这个渠道里的账号标识，只有他们发来的消息会被处理。
#           第一次接入时留空：给机器人发一句话，它会把你的标识回给你，填进来再重启
#   sandbox 机器人还没上线、只在 QQ 的沙箱环境里调试时设为 true
# ---------------------------------------------------------------
# channels:
#   - name: qq
#     type: qq
#     app_id: "102012345"
#     secret: vault://qqbot
#     owners: []

# ---------------------------------------------------------------
# 连接器：直连开放协议的日历（CalDAV）和邮件（IMAP/SMTP）。不写的那一项就不接入。
#
# password 只能写保险库句柄，不接受明文。先把密码存进去并授权给连接器：
#   atomctl vault put icloud "iCloud App 专用密码" connector.calendar,connector.mail
# iCloud 要用「App 专用密码」（在 account.apple.com 的"登录与安全"里生成），不是 Apple ID 的登录密码。
# 写好之后用 atomctl connector check 试连。
#
# 日历的新建和修改：你亲口交代的直接写；任务读过邮件、网页之后的改动要你确认。
# 删除日程、发信、整理邮件默认每一次都要你确认，可以在下面的 approval.rules 里按工具调整。
# ---------------------------------------------------------------
# connectors:
#   calendar:
#     url: https://caldav.icloud.com
#     username: you@icloud.com
#     password: vault://icloud
#     # default_calendar: 个人          # 新建日程默认写进哪个日历；只有一个日历时不用写
#   mail:
#     imap: imap.mail.me.com:993
#     smtp: smtp.mail.me.com:587        # 不写则助手只能读和整理邮件，不能发信
#     username: you@icloud.com
#     password: vault://icloud
#     # from: you@icloud.com            # 发信地址，不写按 username
#     # name: 张三                      # 发信时显示的名字
#     # imap_security / smtp_security: tls / starttls / none，不写按端口推断；none 只允许本机地址
#   # 节假日与调休安排：一个公开的日历订阅，不需要账号。助手靠它知道哪天放假、哪个周末补班
#   holidays:
#     url: https://calendars.icloud.com/holidays/cn_zh.ics

# ---------------------------------------------------------------
# 付款。不写这一节，助手没有任何付款工具。
#
# 需要先安装支付宝官方的 alipay-bot 并开通钱包：
#   npx -y @alipay/agent-payment@latest install
#   atomctl pay wallet open
#
# resource_domains 是允许助手请求的按次收费接口（HTTP 402）的域名，逐个列出，
# 写 example.com 同时允许它的子域名。不写则助手不能主动请求任何网址。
# 每一笔付款都要你确认，并且要你本人在支付宝里授权。
# ---------------------------------------------------------------
# payment:
#   alipay:
#     enabled: true
#     # command: /path/to/alipay-bot     # 不在 PATH 里时指定
#     # resource_domains: [api.example.com]

# ---------------------------------------------------------------
# 已批准的 MCP server。transport 取值: command / http
#
# env 里只列出这个 server 确实需要的变量。主进程的环境不会被继承——
# 否则数据库密码和模型密钥会一并交给第三方工具。
# ---------------------------------------------------------------
mcp_servers: []
# mcp_servers:
#   - name: maps
#     transport: command
#     command: /usr/local/bin/mcp-amap
#     env:
#       - AMAP_KEY=xxx
#   - name: flight
#     transport: http
#     url: https://mcp.example.com/mcp

# ---------------------------------------------------------------
# 工具授权边界。对应用户在 App 上批准某个工具时的选择。
# 目录里可见 ≠ 可调用：没有在这里授权的工具，调用会被直接拒绝。
#
#   max_privacy   允许传给它的最高隐私等级: public / normal / sensitive
#                 不接受 secret——绝密数据不传给任何工具，这条没有开关
#   trust         它的输出信任上限: external / tool_output / connector
#                 不接受 user / system——工具输出不能具备指令资格
#   side_effect   none / read_only / reversible / irreversible
#                 不写按 irreversible 处理（最保守）
#   egress_domains  允许的出站域名。不写表示不允许任何网络出站
#   allowed_fields  允许传入的参数字段。不写则不做字段裁剪
# ---------------------------------------------------------------
tools: []
# tools:
#   - name: maps.geocode
#     max_privacy: normal
#     trust: connector
#     side_effect: read_only
#     egress_domains: [restapi.amap.com]
#     allowed_fields: [address, city]
#
#   - name: maps.book_ride
#     max_privacy: sensitive
#     trust: connector
#     side_effect: irreversible
#     egress_domains: [restapi.amap.com]
#     allowed_fields: [origin, destination, car_type, amount_cents]

# ---------------------------------------------------------------
# 审批策略。默认一律手动确认，下面的规则是"放宽"。
#
# 三条不受配置影响的硬规则：
#   1. 参数含绝密数据(L3) → 直接拒绝，连审批机会都不给
#   2. 由截图/邮件/网页等 untrusted 内容驱动的写操作 → 无论金额一律手动。
#      任务是你建的也一样：它中途读过邮件、网页，之后的写操作就按这一条办
#   3. 只读操作 → 始终放行，不消耗配额
# ---------------------------------------------------------------
approval:
  rules:
    # 私人出行且金额低于 100 元时自动放行
    - tool: maps.book_ride
      amount_below_yuan: 100
      domain: personal

    # 日历的新建和修改默认直接执行（接入了日历连接器时）。想要每次都确认就写 never：
    # - tool: calendar.create
    #   never: true

    # 归档、移进废纸篓这类整理邮件的操作直接执行，不用确认
    # - tool: mail.move

    # 发消息永远手动确认
    - tool: mail.send
      never: true

  # 累计帽子。只设单次阈值是个洞：100 元以下自动放行可以被拆成 50 次。
  caps:
    daily_auto_amount_yuan: 500
    daily_auto_count: 20
    per_task_amount_yuan: 1000
