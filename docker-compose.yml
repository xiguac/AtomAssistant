# 自部署形态：单机 docker-compose 起来即可，不依赖 K8s 等重组件。
services:
  postgres:
    image: postgres:16-alpine
    container_name: atomhelper-pg
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atom}
      POSTGRES_DB: atomhelper
    ports:
      # 只绑定回环地址：数据库不对外暴露。
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atomhelper"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
